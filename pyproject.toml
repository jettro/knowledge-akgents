[project]
name = "knowledge-akgents"
version = "0.1.0"
description = "Sample Akgentic app: a web Human Proxy talking to a team that queries and ingests a Qdrant-backed knowledge base."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "akgentic-core==1.5.15",
    "akgentic-llm",
    "akgentic-agent==1.7.0",
    "akgentic-team==1.8.0",
    "akgentic-tool[qdrant,vector_search,docs]==1.8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "akgentic-catalog==2.2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
eval = [
    "pydantic-evals[logfire]>=2.43,<3",
]

[tool.uv.sources]
#akgentic-tool = { path = "../akgentic-tool", editable = true }
akgentic-llm = { path = "../akgentic-llm", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_akgents", "src/akgentic_evals"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
