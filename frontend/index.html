<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Akgents</title>
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body class="chat-page">
    <header class="app-header">
      <div class="app-header-inner">
        <a data-backend-link class="product-brand" href="/">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span class="brand-name">Knowledge <strong>Akgents</strong></span>
        </a>
        <nav class="app-tabs" aria-label="Primary navigation">
          <a data-backend-link class="active" href="/">
            <span class="tab-icon" aria-hidden="true">◫</span>
            Chat
          </a>
          <a data-backend-link href="settings.html">
            <span class="tab-icon" aria-hidden="true">⌁</span>
            Settings
          </a>
          <a data-backend-link href="teams.html">
            <span class="tab-icon" aria-hidden="true">◎</span>
            Teams
          </a>
        </nav>
        <div id="status" class="status offline">connecting…</div>
      </div>
    </header>

    <main>
      <section id="log" class="log" aria-live="polite"></section>
      <aside id="urls-panel" class="urls-panel">
        <div class="urls-panel-header">
          <h2 id="urls-title">Imported URLs</h2>
          <button id="urls-refresh" type="button" title="Refresh">⟳</button>
        </div>
        <ul id="url-list" class="url-list"></ul>
      </aside>
    </main>

    <footer>
      <div class="ingest">
        <input id="url" type="url" placeholder="https://example.com/page-to-ingest" />
        <button id="ingest">Ingest URL</button>
      </div>
      <form id="composer" class="composer">
        <input
          id="text"
          type="text"
          autocomplete="off"
          placeholder="Ask a question, or @WebIngest / @Knowledge to route directly…"
        />
        <button type="submit">Send</button>
      </form>
    </footer>

    <script type="module" src="app.js?v=2"></script>
  </body>
</html>
